<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Angličtina ve Švýcarsku — učebnice</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17334a;background:#f0f5f1}*{box-sizing:border-box}body{margin:0}.wrap{max-width:860px;margin:auto;padding:16px}header{background:#123f50;color:white;padding:25px 20px;border-radius:0 0 22px 22px}h1{font-size:1.65rem;margin:0 0 8px}h2{font-size:1.3rem}p{line-height:1.7}.muted{color:#607781;font-size:.92rem}.header-sub{color:#d6e9e8}.panel{background:white;border-radius:17px;padding:20px;margin:15px 0;box-shadow:0 3px 15px #14334410}.story{font-size:1.18rem;line-height:2.05;font-weight:550}.word{cursor:pointer;border-radius:3px}.word:active,.word:hover{background:#dcefe4}button,select{font:inherit;border:1px solid #b8d0d0;background:#f6faf9;color:#153b49;border-radius:11px;padding:11px 14px;cursor:pointer}button.primary{background:#17695f;color:white;border:0}button:disabled{opacity:.4}.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.translation{background:#eff8f1;border-left:4px solid #2e8d72;padding:12px 14px;margin-top:12px;border-radius:8px;line-height:1.7}.hidden{display:none}.lookup{position:sticky;top:8px;background:#173f50;color:white;padding:12px 15px;border-radius:12px;z-index:3;box-shadow:0 3px 14px #0003}.lookup button{padding:5px 9px;float:right}.dialogue{margin:12px 0;padding:12px;background:#f5f8f8;border-radius:10px}.dialogue .story{font-size:1.05rem}.quiz textarea{width:100%;border:1px solid #c8d6d6;border-radius:8px;padding:10px;font:inherit;min-height:65px}.foot{padding:24px 0 45px}.note{background:#fff7df;padding:12px;border-radius:10px}select{max-width:100%;width:100%}label{font-weight:600}small{font-size:.84rem}#status{font-weight:600}
</style></head><body><header><div class="wrap"><h1>🇨🇭 Angličtina ve Švýcarsku</h1><div class="header-sub">Příběhy • skryté překlady • slovíčka na dotek • pomalý poslech</div></div></header><main class="wrap"><div class="panel"><label for="chapter">Vyber lekci</label><select id="chapter"></select><p id="status" class="muted"></p><div class="bar"><button id="prev">← Předchozí</button><button id="next">Další lekce →</button></div></div><div id="lookup" class="lookup hidden"><button id="closeLookup" aria-label="Zavřít">×</button><span id="lookupText"></span></div><section id="content"></section><div class="foot muted">Význam slova zobrazíš klepnutím. Překlad odstavce je vždy skrytý, dokud ho neotevřeš. Předčítání používá hlas dostupný v telefonu.</div></main><script src="book-data.js"></script><script>
(()=>{'use strict';const D=window.BOOK_DATA;if(!D){document.getElementById('content').textContent='Chybí soubor book-data.js';return}const extra={title:'A New Neighbour in Interlaken',place:'Interlaken',level:'B1',story:[['Last Saturday, Daniel moved into a small apartment in Interlaken. He had found a new job at a local hotel. Although he was excited, he felt a little nervous because he didn’t know anyone in the town.','Minulou sobotu se Daniel přestěhoval do malého bytu v Interlakenu. Našel si novou práci v místním hotelu. Přestože se těšil, byl trochu nervózní, protože ve městě nikoho neznal.'],['While Daniel was carrying a heavy box upstairs, an older neighbour opened her door. Her name was Mrs Keller. She smiled and asked, “Would you like some help?” Daniel was surprised by her kindness.','Když Daniel nesl těžkou krabici nahoru po schodech, starší sousedka otevřela dveře. Jmenovala se paní Kellerová. Usmála se a zeptala se: „Chtěl byste pomoci?“ Daniela její laskavost překvapila.'],['Mrs Keller invited Daniel for a cup of tea. They talked about the mountains, local shops and life in Switzerland. She recommended a small bakery near the railway station.','Paní Kellerová pozvala Daniela na šálek čaje. Povídali si o horách, místních obchodech a životě ve Švýcarsku. Doporučila mu malou pekárnu poblíž vlakového nádraží.'],['The next morning, Daniel discovered that his bicycle had a flat tyre. He wanted to cycle to work, but he couldn’t. Luckily, Mrs Keller’s son knew how to repair bicycles and offered to help him.','Následující ráno Daniel zjistil, že má na kole prázdnou pneumatiku. Chtěl jet do práce na kole, ale nemohl. Naštěstí syn paní Kellerové uměl opravovat kola a nabídl mu pomoc.'],['By Sunday evening, Daniel felt much more comfortable in his new town. He realised that friendly neighbours could make a big difference. He decided to invite Mrs Keller and her son for dinner the following weekend.','V neděli večer se Daniel ve svém novém městě cítil mnohem příjemněji. Uvědomil si, že přátelští sousedé mohou hodně změnit. Rozhodl se pozvat paní Kellerovou a jejího syna na večeři následující víkend.']],dialogue:[['Daniel','Good morning, Mrs Keller. Thank you for helping me yesterday.','Dobré ráno, paní Kellerová. Děkuji, že jste mi včera pomohla.'],['Mrs Keller','You’re welcome! Are you settling in well?','Rádo se stalo! Zabydlujete se dobře?'],['Daniel','Yes, but I still need to buy a few things for my apartment.','Ano, ale ještě potřebuji koupit pár věcí do bytu.'],['Mrs Keller','There’s a useful shop near the station. I can show you where it is.','U nádraží je šikovný obchod. Mohu vám ukázat, kde je.'],['Daniel','That would be great. I really appreciate your help.','To by bylo skvělé. Opravdu si vážím vaší pomoci.'],['Mrs Keller','No problem. That’s what neighbours are for!','Žádný problém. Od toho jsou sousedé!']],questions:['Why did Daniel move to Interlaken?','How did Daniel meet Mrs Keller?','What place did Mrs Keller recommend?','Why couldn’t Daniel cycle to work?','What did Daniel decide to do the following weekend?']};const dict={...D.dictionary,neighbour:'soused / sousedka',neighbours:'sousedé',kindness:'laskavost',although:'ačkoli / přestože',upstairs:'nahoru po schodech',invited:'pozvala',invite:'pozvat',realised:'uvědomil si',repair:'opravit',luckily:'naštěstí',tyre:'pneumatika',flat:'plochý; také byt (brit.)',bicycle:'jízdní kolo',comfortable:'příjemně / pohodlně',appreciate:'vážit si / ocenit',offered:'nabídl',settling:'zabydlování',discovered:'zjistil',carrying:'nesl',bakery:'pekárna',railway:'železniční',excited:'nadšený',nervous:'nervózní',decided:'rozhodl se',following:'následující',help:'pomoc / pomoci',wanted:'chtěl',shop:'obchod',small:'malý',door:'dveře',opened:'otevřela',smiled:'usmála se',heavy:'těžký',box:'krabice',moved:'přestěhoval se',apartment:'byt',town:'město',station:'nádraží',local:'místní',recommended:'doporučila',anyone:'kdokoli / někoho',offering:'nabízení'};const chapters=D.chapters.map((ch,i)=>{const p=D.pages.filter(x=>x.chapter===i);return {...ch,story:p.filter(x=>x.kind==='story').map(x=>[x.en,x.cz]),dialogue:(p.find(x=>x.kind==='dialogue')||{}).lines||[],exercise:p.find(x=>x.kind==='exercise')}});chapters.push(extra);let current=Number(localStorage.getItem('swissChapter')||0);if(current<0||current>=chapters.length)current=0;const sel=document.getElementById('chapter');chapters.forEach((ch,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${ch.title} — ${ch.place}`;sel.append(o)});const el=document.getElementById('content');let speech=null;function speak(t,rate){if(!('speechSynthesis' in window)){alert('Tento prohlížeč nepodporuje hlasové čtení.');return}speechSynthesis.cancel();speech=new SpeechSynthesisUtterance(t);speech.lang='en-GB';speech.rate=Number(rate||.7);const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('en')&&/GB|United Kingdom/i.test(v.lang+' '+v.name));if(v)speech.voice=v;speechSynthesis.speak(speech)}function words(t){const span=document.createElement('span');const chunks=t.match(/([A-Za-zÀ-ž’'-]+|[^A-Za-zÀ-ž’'-]+)/g)||[];chunks.forEach(s=>{if(/[A-Za-z]/.test(s)){const w=document.createElement('span');w.className='word';w.textContent=s;w.tabIndex=0;w.setAttribute('role','button');w.title='Klepni pro překlad';const fn=()=>lookup(s);w.addEventListener('click',fn);w.addEventListener('keydown',e=>{if(e.key==='Enter')fn()});span.append(w)}else span.append(document.createTextNode(s))});return span}function lookup(s){const k=s.toLowerCase().replace(/^[^a-z]+|[^a-z]+$/g,'').replace('’',"'");const val=dict[k]||dict[k.replace(/s$/,'')]||'Překlad tohoto slova zatím není ve slovníčku.';document.getElementById('lookupText').textContent=`${s} — ${val}`;document.getElementById('lookup').classList.remove('hidden')}document.getElementById('closeLookup').onclick=()=>document.getElementById('lookup').classList.add('hidden');function node(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}function addTranslation(parent,cz){const t=node('div','translation hidden',cz);const b=node('button','','Zobrazit český překlad');b.onclick=()=>{const open=t.classList.toggle('hidden');b.textContent=open?'Zobrazit český překlad':'Skrýt český překlad'};parent.append(b,t)}function addSpeech(parent,t){const bar=node('div','bar');const speed=node('select');[['0.55','Velmi pomalu'],['0.7','Pomalu'],['0.85','Středně'],['1','Normálně']].forEach(([v,lab])=>{const o=node('option','',lab);o.value=v;speed.append(o)});speed.value='.7';speed.style.width='auto';const play=node('button','','▶ Přečíst anglicky');play.onclick=()=>speak(t,speed.value);const stop=node('button','','■ Zastavit');stop.onclick=()=>speechSynthesis.cancel();bar.append(play,speed,stop);parent.append(bar)}function render(){const ch=chapters[current];sel.value=current;document.getElementById('status').textContent=`Lekce ${current+1} z ${chapters.length} · ${ch.place} · ${ch.level}`;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===chapters.length-1;el.replaceChildren();const title=node('div','panel');title.append(node('h2','',ch.title),node('p','muted',`Příběh · ${ch.story.length} odstavců · klepni na slovo pro překlad`));el.append(title);ch.story.forEach(([en,cz],i)=>{const card=node('article','panel');card.append(node('h3','',`Odstavec ${i+1}`));const p=node('p','story');p.append(words(en));card.append(p);addSpeech(card,en);addTranslation(card,cz);el.append(card)});const dia=node('section','panel');dia.append(node('h2','','Praktický rozhovor'));if(Array.isArray(ch.dialogue)){ch.dialogue.forEach((line,i)=>{const box=node('div','dialogue');let en='',cz='',who='';if(Array.isArray(line)){if(line.length===2){[en,cz]=line;who=i%2===0?'A':'B'}else{[who,en,cz]=line}}else if(typeof line==='object'){who=line.speaker||line.role||'';en=line.en||line.english||'';cz=line.cz||line.czech||''}if(en){box.append(node('strong','',who));const p=node('p','story');p.append(words(en));box.append(p);addSpeech(box,en);if(cz)addTranslation(box,cz);dia.append(box)}})}else if(ch.dialogue){const d=ch.dialogue;const p=node('p','story');p.append(words(d.en||''));dia.append(p);if(d.en)addSpeech(dia,d.en);if(d.cz)addTranslation(dia,d.cz)}el.append(dia);const quiz=node('section','panel quiz');quiz.append(node('h2','','Otázky k porozumění'));let qs=ch.questions||ch.exercise?.questions||ch.exercise?.items||[];if(typeof qs==='string')qs=[qs];if(!Array.isArray(qs))qs=[];if(!qs.length&&ch.exercise){const x=ch.exercise;quiz.append(node('p','',x.en||x.prompt||x.question||'Zkus vlastními slovy převyprávět příběh.'))}qs.forEach((q,i)=>{const text=typeof q==='string'?q:Array.isArray(q)?q[0]:q.question||q.en||'';if(!text)return;const block=node('div','');block.append(node('p','',`${i+1}. ${text}`));const input=node('textarea');input.placeholder='Your answer in English…';block.append(input);quiz.append(block)});el.append(quiz);localStorage.setItem('swissChapter',String(current));document.getElementById('lookup').classList.add('hidden');window.scrollTo({top:0,behavior:'instant'})}sel.onchange=()=>{current=Number(sel.value);render()};document.getElementById('prev').onclick=()=>{current--;render()};document.getElementById('next').onclick=()=>{current++;render()};render()})();
</script></body></html>
