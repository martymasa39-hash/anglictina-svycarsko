<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#163b52"><title>Angličtina ve Švýcarsku · Interaktivní kniha</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#153149;background:#edf4f2;font-size:18px}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#d7eaf0,#f4f5df 52%,#e2ece8);min-height:100vh}.shell{max-width:1050px;margin:auto;padding:20px}.top{background:#163b52;color:white;border-radius:24px;padding:23px 26px;box-shadow:0 12px 32px #163b5225}.top small{letter-spacing:.15em;text-transform:uppercase;color:#b9e4d6}.top h1{font-size:clamp(26px,4vw,43px);margin:6px 0 4px}.top p{margin:4px 0;color:#e0f0ed}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}.btn,select,input[type=range]{font:inherit}.btn{background:white;border:1px solid #b8cfd0;color:#153149;border-radius:12px;padding:11px 15px;cursor:pointer;font-weight:750}.btn:hover,.word:hover{background:#f0e7c9}.btn.primary{background:#e6b85c;border-color:#e6b85c;color:#18354a}.btn:disabled{opacity:.4;cursor:not-allowed}.toolbar label{font-weight:700;font-size:.85rem}.layout{display:grid;grid-template-columns:245px 1fr;gap:18px}.sidebar,.paper{background:#fffdf5;border:1px solid #d8e0d7;box-shadow:0 12px 28px #163b5212;border-radius:22px}.sidebar{padding:16px;align-self:start;max-height:72vh;overflow:auto}.sidebar h2{font-size:1rem;margin:0 0 10px}.chapterLink{display:block;width:100%;text-align:left;border:0;border-radius:10px;padding:10px 8px;background:transparent;color:#29485c;cursor:pointer;font-weight:650}.chapterLink.active{background:#e4efe8;color:#14583c}.chapterLink small{display:block;color:#667e7c;font-weight:500}.paper{padding:clamp(20px,5vw,45px);min-height:530px;position:relative;overflow:hidden}.paper:before{content:'';position:absolute;right:-90px;top:-100px;width:230px;height:230px;border-radius:50%;background:#cfe9e44d;pointer-events:none}.eyebrow{font-size:.78rem;font-weight:850;letter-spacing:.13em;color:#327765;text-transform:uppercase}.paper h2{font-size:clamp(25px,3.5vw,38px);line-height:1.2;margin:12px 0}.story{font-size:1.22em;line-height:2.05;font-weight:650;position:relative}.translation{background:#e8f3ed;border-left:5px solid #3a947a;border-radius:12px;padding:17px 19px;line-height:1.7;margin-top:20px;font-weight:550}.translation strong{display:block;font-size:.78em;text-transform:uppercase;letter-spacing:.07em;color:#397b68;margin-bottom:7px}.word{border:0;border-bottom:2px dotted #bd9b57;background:transparent;color:inherit;font:inherit;font-weight:inherit;padding:0 1px;cursor:pointer;border-radius:3px}.word:focus-visible{outline:3px solid #efb74d}.lookup{margin:18px 0;background:#fff0c9;border:1px solid #e6b85c;border-radius:14px;padding:14px 18px;min-height:65px}.lookup b{color:#754e13}.lookup p{margin:6px 0}.pageNav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:25px;border-top:1px solid #e2e6dd;padding-top:20px}.muted{color:#637a7d;font-size:.87em}.progress{height:9px;border-radius:10px;background:#d4e5df;overflow:hidden;margin-top:13px}.progress>div{background:#d9a747;height:100%;transition:width .2s}.hero{background:linear-gradient(135deg,#184d5d,#3d8276);color:white;border-radius:18px;padding:25px;margin:25px 0}.hero .mountains{font-size:4rem;line-height:1.1}.hero p{color:#f0f7f4}.dialogueLine{margin:12px 0;padding:12px 15px;background:#f1f5ee;border-radius:12px}.dialogueLine:nth-child(even){background:#e5f1ef}.dialogueLine p{margin:5px 0}.question{border-top:1px solid #d9e5dd;padding:16px 0}.question input{width:100%;border:1px solid #bacfca;border-radius:10px;padding:12px;margin:10px 0;background:white;font:inherit}.hint{font-size:.85em;color:#516f6c}.result{background:#e9f1e7;border-radius:10px;padding:12px;margin-top:8px}.settings{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.settings input{width:90px}footer{text-align:center;padding:24px;color:#57716d;font-size:.8rem}@media(max-width:750px){.shell{padding:10px}.layout{display:block}.sidebar{max-height:180px;margin-bottom:12px}.paper{min-height:500px}.top{border-radius:16px}.toolbar{gap:7px}.btn{padding:10px 11px}.story{font-size:1.12em}}
</style></head><body><div class="shell"><header class="top"><small>Interaktivní jazyková čítanka</small><h1>🇨🇭 Angličtina ve Švýcarsku</h1><p>25 kapitol · 200 výukových stránek · A2 → B1+ · Čeština + angličtina</p><div class="progress"><div id="progress"></div></div><small id="progressText"></small></header><div class="toolbar"><button class="btn" id="contents">☰ Kapitoly</button><button class="btn" id="speak">🔊 Přečíst anglicky</button><button class="btn" id="stop">■ Zastavit</button><div class="settings"><label for="speed">Rychlost</label><input type="range" id="speed" min="0.55" max="1.1" step="0.05" value="0.75"><span id="speedValue">0,75×</span></div><button class="btn" id="size">A+ Písmo</button></div><div class="layout"><nav class="sidebar" id="sidebar"><h2>Obsah knihy</h2><div id="chapters"></div></nav><main class="paper" id="paper" aria-live="polite"></main></div><footer>Originální studijní příběhy inspirované Švýcarskem. Ceny a rozhovory jsou modelové. Překlady jednotlivých slov jsou studijní pomůcka.</footer></div><script src="book-data.js"></script><script>
(()=>{'use strict';const data=window.BOOK_DATA,chapters=data.chapters,pages=data.pages,dict=data.dictionary;let page=Math.min(199,Math.max(0,Number(localStorage.getItem('swiss-page')||0))),fontSize=Number(localStorage.getItem('swiss-font')||18),revealed=false;const $=id=>document.getElementById(id);const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.documentElement.style.fontSize=fontSize+'px';
function words(s){return escape(s).replace(/([A-Za-zÀ-ÿ]+(?:[’'][A-Za-z]+)?)/g,(m)=>`<button class="word" type="button" data-word="${escape(m.toLowerCase().replace('’',"'"))}" aria-label="Přeložit ${escape(m)}">${m}</button>`)}
function nav(){return `<div class="pageNav"><button class="btn" id="prev" ${page===0?'disabled':''}>← Předchozí</button><span class="muted">Strana <b>${page+1}</b> / ${pages.length}</span><button class="btn primary" id="next" ${page===pages.length-1?'disabled':''}>Další →</button></div>`}
function render(){const p=pages[page],ch=chapters[p.chapter];localStorage.setItem('swiss-page',page);$('progress').style.width=((page+1)/pages.length*100)+'%';$('progressText').textContent=`Přečteno do strany ${page+1} z ${pages.length}`;$('chapters').innerHTML=chapters.map((c,i)=>`<button class="chapterLink ${p.chapter===i?'active':''}" data-ch="${i}">${i+1}. ${escape(c.title)}<small>${escape(c.place)} · ${c.level} · str. ${i*8+1}–${i*8+8}</small></button>`).join('');let h=`<div class="eyebrow">Kapitola ${p.chapter+1} · ${escape(ch.level)} · ${escape(ch.place)}</div>`;
if(p.kind==='intro')h+=`<div class="hero"><div class="mountains">🏔️ 🚞 🇨🇭</div><h2>${escape(ch.title)}</h2><p>${escape(ch.place)} · ${escape(ch.topic)}</p></div><p>V této kapitole tě čeká pět krátkých příběhových odstavců s překladem, praktický rozhovor a samostatné procvičování.</p><p><strong>Jak číst:</strong> Klepni na jakékoliv anglické slovo. Zobrazí se jeho význam nebo český kontext. Tlačítkem 🔊 můžeš spustit pomalé čtení.</p><p class="muted">Každá kapitola má osm výukových stránek. Obtížnost se postupně zvyšuje.</p>`;
if(p.kind==='story')h+=`<h2>${escape(ch.title)} · ${p.part}/5</h2><div class="story" id="readText">${words(p.en)}</div><div class="translation"><strong>Český překlad</strong>${escape(p.cz)}</div><div id="lookup" class="lookup" hidden></div><p class="muted">💡 Přečti anglický odstavec dvakrát pomalu nahlas. Pak zkus jednou bez překladu.</p>`;
if(p.kind==='dialogue')h+=`<h2>💬 Praktický rozhovor</h2><p class="muted">Procvič rozhovor v prostředí: ${escape(ch.topic)}. Střídej obě role.</p><div id="readText">${p.lines.map((l,i)=>`<div class="dialogueLine"><strong>${i%2?'B':'A'}:</strong> <span class="story">${words(l[0])}</span><p class="muted">${escape(l[1])}</p></div>`).join('')}</div><div id="lookup" class="lookup" hidden></div>`;
if(p.kind==='exercise')h+=`<h2>✍️ Otázky a procvičování</h2><p>Odpovídej anglicky. Po kliknutí na „Ukázat vzorovou odpověď“ můžeš svoji větu porovnat s textem. Odpovědi se nehodnotí automaticky.</p>${p.questions.map((q,i)=>`<div class="question"><strong>${i+1}. ${escape(q[0])}</strong><input aria-label="Odpověď na otázku ${i+1}" data-q="${i}" placeholder="Your answer in English…" value="${escape(localStorage.getItem('swiss-answer-'+page+'-'+i)||'')}"><button class="btn" data-show="${i}">Ukázat vzorovou odpověď</button><div class="result" id="result${i}" hidden>${escape(q[1])}</div></div>`).join('')}<div class="translation"><strong>Gramatika</strong>${escape(p.grammar)}</div><p class="muted">🎙️ Mluvení: shrň příběh třemi vlastními větami v angličtině.</p>`;
$('paper').innerHTML=h+nav();$('paper').querySelectorAll('[data-word]').forEach(b=>b.addEventListener('click',()=>{const w=b.dataset.word;let meaning=dict[w]||'Zkus význam odvodit z českého překladu odstavce.';const el=$('lookup');el.hidden=false;el.innerHTML=`<b>${escape(w)}</b><p>${escape(meaning)}</p>`}));$('paper').querySelectorAll('[data-show]').forEach(b=>b.addEventListener('click',()=>{$('result'+b.dataset.show).hidden=!$('result'+b.dataset.show).hidden}));$('paper').querySelectorAll('[data-q]').forEach(b=>b.addEventListener('input',()=>localStorage.setItem('swiss-answer-'+page+'-'+b.dataset.q,b.value)));$('prev').onclick=()=>go(page-1);$('next').onclick=()=>go(page+1);$('chapters').querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>go(Number(b.dataset.ch)*8));}
function go(n){if(n<0||n>=pages.length)return;if('speechSynthesis'in window)window.speechSynthesis.cancel();page=n;render();window.scrollTo({top:0,behavior:'smooth'})}
$('contents').onclick=()=>{const e=$('sidebar');e.hidden=!e.hidden};$('size').onclick=()=>{fontSize=fontSize>=23?17:fontSize+2;document.documentElement.style.fontSize=fontSize+'px';localStorage.setItem('swiss-font',fontSize)};$('speed').oninput=()=>{$('speedValue').textContent=Number($('speed').value).toFixed(2).replace('.',',')+'×'};
$('speak').onclick=()=>{if(!('speechSynthesis'in window)){alert('Tento prohlížeč nepodporuje hlasité čtení.');return}window.speechSynthesis.cancel();const p=pages[page];let text=p.kind==='story'?p.en:p.kind==='dialogue'?p.lines.map(x=>x[0]).join(' '):p.kind==='intro'?chapters[p.chapter].title:p.questions.map(x=>x[0]).join(' ');const utter=new SpeechSynthesisUtterance(text);utter.lang='en-GB';utter.rate=Number($('speed').value);const voices=speechSynthesis.getVoices();utter.voice=voices.find(v=>v.lang==='en-GB')||voices.find(v=>v.lang.startsWith('en'))||null;speechSynthesis.speak(utter)};$('stop').onclick=()=>{'speechSynthesis'in window&&speechSynthesis.cancel()};render();})();
</script></body></html>
